name: Control Atlas Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  codeql:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  secrets:
    name: Secret scan
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'schedule' }}
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'schedule' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.24.3
        shell: bash
        run: |
          version='8.24.3'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location --remote-name "${release}/${archive}"
          curl --fail --silent --show-error --location --remote-name "${release}/${checksums}"
          grep "  ${archive}$" "$checksums" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --no-same-owner gitleaks
      - name: Scan the complete checked-out snapshot
        run: ./gitleaks dir . --redact --config=.gitleaks.toml --report-format=sarif --report-path=results.sarif
      - name: Scan complete history on the weekly schedule
        if: ${{ always() && github.event_name == 'schedule' }}
        run: ./gitleaks git . --redact --config=.gitleaks.toml --report-format=sarif --report-path=history-results.sarif
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: results.sarif
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: ${{ always() && github.event_name == 'schedule' }}
        with:
          sarif_file: history-results.sarif

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Reject tracked AI control-plane files
        shell: bash
        run: |
          if [[ -f .repo-mode ]] && grep -qi template .repo-mode; then
            exit 0
          fi

          blocked='^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|\.agents/|\.ai/|\.claude/|\.codex|\.gemini/|\.cursor/agents/|settings\.local\.json|docs/agents/|docs/plans/)|\.plan-status|WORKLOG-|SYSTEM_INSTRUCTIONS\.md'
          if git ls-files | grep -Eq "$blocked"; then
            echo 'AI control-plane files detected in tracked content.'
            git ls-files | grep -E "$blocked"
            exit 1
          fi

          markers='BEGIN core-engineering-doctrine|guardrails-kit:|MIRRORED from.*claude|Required Startup Sequence'
          if git grep -IinE "$markers" -- '*.md' '*.json'; then
            echo 'AI control-plane content markers detected.'
            exit 1
          fi
