name: Merge validated source refresh

on:
  workflow_run:
    workflows: [Control Atlas CI, Control Atlas Security]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: source-refresh-automerge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.head_branch == 'automation/source-refresh' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: refresh-app
        with:
          client-id: ${{ vars.REFRESH_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFRESH_APP_PRIVATE_KEY }}
          owner: RAMBULLS
          repositories: control-atlas
          permission-contents: write
          permission-pull-requests: write
      - name: Require independent gates and merge the exact tested commit
        run: node tools/automerge-source-refresh.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_MERGE_TOKEN: ${{ steps.refresh-app.outputs.token }}
